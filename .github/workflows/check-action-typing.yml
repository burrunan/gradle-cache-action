name: Check Action Typing

on:
    push:
      paths:
        - 'action.yml'
        - 'action-types.yml'
    pull_request:
      paths:
        - 'action.yml'
        - 'action-types.yml'

jobs:
    check_action_typing:
        name: Check Action Typing
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Check Action Typing
              uses: krzema12/github-actions-typing@9ddf35b71a482be7d8922b28e8d00df16b77e315 # v2.2.2
